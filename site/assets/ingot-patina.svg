<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 64" role="img" aria-label="Oxidised copper ingot">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9f1ec"/>
      <stop offset=".55" stop-color="#7fd3cc"/>
      <stop offset="1" stop-color="#4fb3ab"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa79f"/>
      <stop offset=".5" stop-color="#2f857c"/>
      <stop offset="1" stop-color="#1c5a52"/>
    </linearGradient>
    <linearGradient id="end" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a7a70"/>
      <stop offset="1" stop-color="#174b44"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g stroke="#123c36" stroke-width="1.6" stroke-linejoin="round">
    <!-- front face -->
    <path d="M14 24 H96 L108 58 H4 Z" fill="url(#front)"/>
    <!-- right end face -->
    <path d="M96 24 L104 12 L116 44 L108 58 Z" fill="url(#end)"/>
    <!-- top face -->
    <path d="M26 6 H104 L96 24 H14 Z" fill="url(#top)"/>
  </g>
  <!-- shine across the top and a bright front edge -->
  <path d="M40 8 H64 L58 22 H34 Z" fill="url(#shine)"/>
  <path d="M15 25.5 H95.5" stroke="#d8fbf6" stroke-width="1.4" stroke-opacity=".8"/>
  <!-- stamped merchant's mark -->
  <g fill="none" stroke="#1c5a52" stroke-width="1.6" stroke-linecap="round" opacity=".85">
    <rect x="50" y="10.5" width="22" height="9" rx="2"/>
    <path d="M55 13 l3 4 l3 -4 M64 13 v4 M67 15 h3"/>
  </g>
</svg>
