<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 64" role="img" aria-label="Copper ingot">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9bd"/>
      <stop offset=".55" stop-color="#eaa577"/>
      <stop offset="1" stop-color="#d98a58"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c97c45"/>
      <stop offset=".5" stop-color="#a8622d"/>
      <stop offset="1" stop-color="#6e3d17"/>
    </linearGradient>
    <linearGradient id="end" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d5426"/>
      <stop offset="1" stop-color="#5e3412"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g stroke="#4a2810" stroke-width="1.6" stroke-linejoin="round">
    <!-- front face -->
    <path d="M14 24 H96 L108 58 H4 Z" fill="url(#front)"/>
    <!-- right end face -->
    <path d="M96 24 L104 12 L116 44 L108 58 Z" fill="url(#end)"/>
    <!-- top face -->
    <path d="M26 6 H104 L96 24 H14 Z" fill="url(#top)"/>
  </g>
  <!-- shine across the top and a bright front edge -->
  <path d="M40 8 H64 L58 22 H34 Z" fill="url(#shine)"/>
  <path d="M15 25.5 H95.5" stroke="#ffe3cc" stroke-width="1.4" stroke-opacity=".8"/>
  <!-- stamped merchant's mark -->
  <g fill="none" stroke="#7c4a1e" stroke-width="1.6" stroke-linecap="round" opacity=".85">
    <rect x="50" y="10.5" width="22" height="9" rx="2"/>
    <path d="M55 13 l3 4 l3 -4 M64 13 v4 M67 15 h3"/>
  </g>
</svg>
