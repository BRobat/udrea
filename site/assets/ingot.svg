<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 56" role="img" aria-label="Copper ingot">
  <!-- A solid trapezoidal bar seen from the front-right and above:
       the top face is smaller than the base, and all faces share edges. -->
  <defs>
    <linearGradient id="top" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f3b58c"/>
      <stop offset="1" stop-color="#ffdcc2"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0864f"/>
      <stop offset=".55" stop-color="#a8622d"/>
      <stop offset="1" stop-color="#6e3d17"/>
    </linearGradient>
    <linearGradient id="end" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a5c2a"/>
      <stop offset="1" stop-color="#5e3412"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g stroke="#4a2810" stroke-width="1.6" stroke-linejoin="round">
    <!-- front face -->
    <path d="M6 50 H100 L88 22 H18 Z" fill="url(#front)"/>
    <!-- right end face -->
    <path d="M100 50 L116 32 L100 8 L88 22 Z" fill="url(#end)"/>
    <!-- top face -->
    <path d="M18 22 H88 L100 8 H30 Z" fill="url(#top)"/>
  </g>
  <!-- shine on the top, bright edge where top meets front -->
  <path d="M40 20.5 H58 L68 9.5 H50 Z" fill="url(#shine)"/>
  <path d="M19.5 23.6 H86.5" stroke="#ffe3cc" stroke-width="1.3" stroke-opacity=".75"/>
  <!-- stamped merchant's mark on the front -->
  <g fill="none" stroke="#5e3412" stroke-width="1.6" stroke-linecap="round" opacity=".8">
    <rect x="41" y="30" width="24" height="11" rx="2"/>
    <path d="M46 33 l3 5 l3 -5 M56 33 v5 M59 35.5 h3"/>
  </g>
</svg>
