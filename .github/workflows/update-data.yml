name: Update copper data

on:
  schedule:
    # Every 4 hours, at minute 23: off the busy :00/:30 slots, when GitHub delays or skips scheduled runs.
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch news
        run: npm run fetch:news
      - name: Fetch prices
        run: npm run fetch:prices
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/*.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): update copper news and prices [skip ci]"
            git push
          fi

  # Commits made with GITHUB_TOKEN don't trigger other workflows, so deploy from here.
  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
